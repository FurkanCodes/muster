name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The toolchain is rust-toolchain.toml's (ARC-18). Linux images are pinned
# so a runner upgrade is a reviewed change, not a surprise on the next push.
jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    env:
      # Warnings fail the build, clippy's included (ARC-16).
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-shear,typos
      - name: File size (ARC-08)
        run: scripts/check-file-size.sh
      - name: No credentials (ARC-20)
        run: scripts/check-no-secrets.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Spelling
        run: typos
      - name: Unused dependencies (ARC-17)
        run: cargo shear
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test
        run: cargo nextest run --workspace --locked --profile ci
      - name: Doc tests
        run: cargo test --workspace --doc --locked

  oldest-rust:
    name: Oldest Rust (rust-version)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$version" --profile minimal
          echo "RUST_VERSION=$version" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      # It must build there (ARC-18); lints differ between versions, so
      # their warnings are the pinned toolchain's to judge.
      - name: Builds on the Rust it declares
        run: cargo "+$RUST_VERSION" check --workspace --all-targets --locked

  docker:
    name: Real Docker (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Pull the test image
        run: docker pull alpine:3
      - name: Daemon tests with real Docker
        run: cargo test --locked -p muster-daemon
        env:
          MUSTER_DOCKER_TESTS: "1"
          MUSTER_TEST_IMAGE: alpine:3
      - name: Runs end to end with real Docker
        run: cargo test --locked -p muster --test docker_runs
        env:
          MUSTER_DOCKER_TESTS: "1"

  # The desktop app (ARCHITECTURE.md §5c, §13): its webview's checks and
  # tests, the bindings check, and its Rust side, a Cargo workspace of its
  # own (ARC-24). On a Mac, whose WebKit the window runs in.
  desktop:
    name: Desktop app (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    env:
      # Warnings fail the build, clippy's included (ARC-16).
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: rustup toolchain install
        working-directory: .
      # The app's own target, and the core's, where the link's end-to-end
      # tests build the `muster` they run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            . -> target
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: End to end in WebKit
        run: |
          pnpm exec playwright install webkit
          pnpm e2e
      # The webview is typed by the daemon's own types (ARC-24): written
      # afresh, they must be what is committed.
      - name: Bindings are current
        run: |
          pnpm bindings
          git diff --exit-code -- src/ipc/generated
          test -z "$(git status --porcelain -- src/ipc/generated)"
      - name: Rust format
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - name: Rust lint
        run: cargo clippy --all-targets --locked
        working-directory: apps/desktop/src-tauri
      - name: Rust tests
        run: cargo test --locked
        working-directory: apps/desktop/src-tauri

  dependencies:
    name: Dependencies (licenses, advisories, build scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
