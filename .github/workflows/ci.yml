name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: File size (ARC-08)
        run: scripts/check-file-size.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  docker:
    name: Real Docker (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pull the test image
        run: docker pull alpine:3
      - name: Daemon tests with real Docker
        run: cargo test --locked -p muster-daemon
        env:
          MUSTER_DOCKER_TESTS: "1"
          MUSTER_TEST_IMAGE: alpine:3
      - name: Runs end to end with real Docker
        run: cargo test --locked -p muster --test docker_runs
        env:
          MUSTER_DOCKER_TESTS: "1"

  dependencies:
    name: Dependencies (licenses and advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
