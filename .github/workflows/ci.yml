name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The toolchain is rust-toolchain.toml's (ARC-18). Linux images are pinned
# so a runner upgrade is a reviewed change, not a surprise on the next push.
jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    env:
      # Warnings fail the build, clippy's included (ARC-16).
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # What reads the same on any system runs on Linux alone; the Mac
      # builds, lints and tests the code that is its own.
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-shear,typos
      - name: File size (ARC-08)
        if: runner.os == 'Linux'
        run: scripts/check-file-size.sh
      - name: Type size (ARC-08)
        if: runner.os == 'Linux'
        run: scripts/check-type-size.sh
      - name: No credentials (ARC-20)
        if: runner.os == 'Linux'
        run: scripts/check-no-secrets.sh
      - name: The TUI's colours are its theme's (ARC-29)
        if: runner.os == 'Linux'
        run: scripts/check-tui-colours.sh
      - name: Tests wait on what happens, never a guess (ARC-30)
        if: runner.os == 'Linux'
        run: scripts/check-test-sleeps.sh
      - name: Nothing written twice (ARC-31)
        if: runner.os == 'Linux'
        run: python3 scripts/check-duplication.py
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Spelling
        if: runner.os == 'Linux'
        run: typos
      - name: Unused dependencies (ARC-17)
        if: runner.os == 'Linux'
        run: cargo shear
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked
      - name: Docs
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test
        run: cargo nextest run --workspace --locked --profile ci
      - name: Doc tests
        if: runner.os == 'Linux'
        run: cargo test --workspace --doc --locked

  oldest-rust:
    name: Oldest Rust (rust-version)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$version" --profile minimal
          echo "RUST_VERSION=$version" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      # It must build there (ARC-18); lints differ between versions, so
      # their warnings are the pinned toolchain's to judge.
      - name: Builds on the Rust it declares
        run: cargo "+$RUST_VERSION" check --workspace --all-targets --locked

  dependencies:
    name: Dependencies (licenses, advisories, build scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
