[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.8"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
repository = "https://github.com/FurkanCodes/muster"

[workspace.dependencies]
muster-core = { path = "crates/muster-core" }
muster-state = { path = "crates/muster-state" }
muster-daemon = { path = "crates/muster-daemon" }
muster-tui = { path = "crates/muster-tui" }
muster-client = { path = "crates/muster-client" }

base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.152"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
ulid = { version = "3.0.0", features = ["serde"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
tui-term = "0.3.4"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
portable-pty = "0.9.0"
reqwest = { version = "0.13.5", features = ["json", "form", "query", "stream"] }
vt100 = "0.16.2"
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.31.3", features = ["fs", "poll", "process", "signal", "term", "user"] }
rustix = { version = "1.1.5", features = ["termios"] }
rmp-serde = "1.3.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
toml_edit = { version = "0.25.16", default-features = false, features = ["parse", "display"] }
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
# Denied everywhere; allowed in one audited module only, the daemon's
# descriptor handoff (`ARC-12`), which no safe interface can express.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# The profile release binaries are built with (dist).
[profile.dist]
inherits = "release"
lto = "thin"
