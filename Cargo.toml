[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
muster-core = { path = "crates/muster-core" }
muster-state = { path = "crates/muster-state" }
muster-daemon = { path = "crates/muster-daemon" }
muster-tui = { path = "crates/muster-tui" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
ulid = { version = "3.0.0", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
