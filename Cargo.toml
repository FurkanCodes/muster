[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.26"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
repository = "https://github.com/FurkanCodes/muster"

[workspace.dependencies]
muster-core = { path = "crates/muster-core" }
muster-state = { path = "crates/muster-state" }
muster-daemon = { path = "crates/muster-daemon" }
muster-tui = { path = "crates/muster-tui" }
muster-client = { path = "crates/muster-client" }
muster-notch = { path = "crates/muster-notch" }

base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.152"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
ulid = { version = "3.0.0", features = ["serde"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
tui-term = "0.3.4"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
portable-pty = "0.9.0"
reqwest = { version = "0.13.5", features = ["json", "form", "query", "stream"] }
vt100 = "0.16.2"
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.31.3", features = ["fs", "poll", "process", "resource", "signal", "term", "user"] }
rustix = { version = "1.1.5", features = ["termios"] }
rmp-serde = "1.3.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
# Property tests of what parses untrusted input, and of the state machines.
proptest = { version = "1.12", default-features = false, features = ["std"] }
thiserror = "2.0.21"
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
toml_edit = { version = "0.25.16", default-features = false, features = ["parse", "display"] }
# The 1.53 line has Tokio's long-term support (to September 2027): fixes
# backported, nothing new. Moving on is a decision, not an update.
tokio = { version = "~1.53.2", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The notch (`ARC-22`), on macOS only: AppKit through Rust's own bindings,
# each framework's default features (every class it has) turned off.
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std"] }

[workspace.lints.rust]
# Denied everywhere; allowed in one audited module only, the daemon's
# descriptor handoff (`ARC-12`), which no safe interface can express.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

# Warnings fail CI (`CARGO_BUILD_WARNINGS=deny`). A suppression is an
# #[expect] with a reason (`ARC-16`).
[workspace.lints.clippy]
# Pedantic, but for lints that do not fit an application whose crates are
# its own (each opted out below, with why).
pedantic = { level = "warn", priority = -1 }
# Muster's crates are not published; their callers are its own code.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
# `assert_eq!(list, [])` shows what the list held when it fails;
# `assert!(list.is_empty())` would not.
assert_is_empty = "allow"
# Names that differ by a letter are often the clearest (`run`, `runs`).
similar_names = "allow"
# Settings and flags read as bools.
struct_excessive_bools = "allow"
# Hook and escape tables list each case by what it matches, with its own
# comment; merging them by their bodies would scatter that.
match_same_arms = "allow"

# One module file style: `foo.rs` beside `foo/`, as the Rust book has it.
mod_module_files = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
get_unwrap = "warn"
mem_forget = "warn"
large_futures = "warn"

# Line numbers in backtraces, without full debug info: faster builds.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# The profile release binaries are built with (dist).
[profile.dist]
inherits = "release"
lto = "thin"

# A release build with symbols, for profilers (samply, Instruments):
# `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
