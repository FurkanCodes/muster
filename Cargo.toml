[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
muster-core = { path = "crates/muster-core" }
muster-state = { path = "crates/muster-state" }
muster-daemon = { path = "crates/muster-daemon" }
muster-tui = { path = "crates/muster-tui" }
muster-client = { path = "crates/muster-client" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
ulid = { version = "3.0.0", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.31.3", features = ["fs", "signal", "user"] }
rmp-serde = "1.3.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
