# Spelling, checked in CI (`typos`).

[files]
extend-exclude = [
    # Reference material and research notes, quoted as written.
    "research_notes/",
    "reports/",
    ".codegraph/",
    # Recorded agent output.
    "**/fixtures/**",
]

[default.extend-words]
# Names, not typos.
ratatui = "ratatui"
# "PNGs", split by typos.
PN = "PN"
# GraphQL's "not in" (Linear's API).
nin = "nin"
# Misspelt on purpose, in tests that a mistyped key or text is refused or
# kept as it is.
comands = "comands"
projet = "projet"
memroy = "memroy"
teh = "teh"
shwo = "shwo"
