<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muster Desktop, adding a project</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/muster/tokens.css">
<link rel="stylesheet" href="ds/muster/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="mu-root" data-theme="{{theme}}" style="position: relative; height: 100vh; min-height: 600px; display: flex; flex-direction: column; overflow: hidden">

<header class="mu-titlebar" style="flex: none">
<div class="mu-traffic" aria-hidden="true"><span></span><span></span><span></span></div>
<span class="mu-kep mu-kep--asleep">▼-ᴥ-▼ᶻ</span>
<span class="mu-spacer"></span>
</header>

<div style="flex: 1; min-height: 0; display: flex; overflow: hidden">
<nav class="mu-nav" aria-label="Screens" style="flex: 0 0 var(--layout-sidebar)">
<button class="mu-nav-item" aria-current="page"><span class="mu-nav-icon" style="font-size: 10px">▲</span>Needs you</button>
<button class="mu-nav-item"><span class="mu-nav-icon">≡</span>All sessions</button>
<div class="mu-nav-label">Projects</div>
<button class="mu-nav-item"><span class="mu-nav-icon">+</span>Add a project</button>
</nav>
<main style="flex: 1; display: flex; background: var(--surface-ground)">
<div class="mu-empty">
<img class="mu-kep-portrait" src="/_blob/ccbf6d369010696adc210014fd667374" alt="">
<h1 class="mu-empty-title">Add a project to start</h1>
</div>
</main>
</div>

<div class="mu-scrim" style="position: absolute; inset: 0; z-index: var(--z-scrim); display: flex; align-items: flex-start; justify-content: center; padding: 120px var(--space-24) var(--space-24)">
<div class="mu-dialog" role="dialog" aria-modal="true" aria-labelledby="ap-title" style="width: var(--size-dialog-wide)">
<div style="display: flex; flex-direction: column; gap: var(--space-4)">
<h2 class="mu-dialog-title" id="ap-title">Add a project</h2>
<span class="mu-meta">A git repository gets worktrees, tickets and pull requests. A plain folder gets sessions in the folder itself, and the rest once it is a repository.</span>
</div>
<div class="mu-field">
<label class="mu-field-label" for="folder">Folder</label>
<input class="mu-field-input" id="folder" value="~/code/la" style="font-family: var(--font-mono); font-size: 12px; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent)">
<div role="listbox" aria-label="Folders in ~/code" style="display: flex; flex-direction: column; gap: var(--space-2); padding-top: var(--space-4)">
<button class="mu-folder" role="option" aria-selected="true"><mark>la</mark>mphaus<span class="mu-label">git</span></button>
<button class="mu-folder" role="option"><mark>la</mark>mphaus-api<span class="mu-label">git</span></button>
<button class="mu-folder" role="option"><mark>la</mark>bs</button>
</div>
<span class="mu-field-hint">⇥ fills in the chosen folder. Folders starting with a dot show once you type one.</span>
</div>
<div class="mu-dialog-actions">
<button class="mu-btn mu-btn--secondary mu-btn--lg" title="Cancel (⎋)">Cancel</button>
<button class="mu-btn mu-btn--primary mu-btn--lg" title="Add lamphaus (⏎)">Add lamphaus</button>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
