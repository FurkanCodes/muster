<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muster Desktop, starting a session</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/muster/tokens.css">
<link rel="stylesheet" href="ds/muster/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="mu-root" data-theme="{{theme}}" style="position: relative; height: 100vh; min-height: 600px; display: flex; flex-direction: column; overflow: hidden">

<header class="mu-titlebar" style="flex: none">
<div class="mu-traffic" aria-hidden="true"><span></span><span></span><span></span></div>
<span class="mu-kep mu-kep--barking">▲•ᴥ•▲!</span>
<span class="mu-spacer"></span>
<div class="mu-flock" aria-label="3 working, 2 waiting on you, 4 done"><span style="color: var(--working)"><span class="mu-mono" aria-hidden="true">⠹</span>3</span><span style="color: var(--waiting)"><span class="mu-mono" style="font-size: 10px" aria-hidden="true">▲</span>2</span><span style="color: var(--done)"><span class="mu-mono" aria-hidden="true">✓</span>4</span></div>
</header>

<div style="flex: 1; min-height: 0; display: flex; overflow: hidden">
<nav class="mu-nav" aria-label="Screens" style="flex: 0 0 var(--layout-sidebar)">
<button class="mu-nav-item"><span class="mu-nav-icon" style="color: var(--waiting); font-size: 10px">▲</span>Needs you<span class="mu-nav-count mu-nav-count--waiting">2</span></button>
<button class="mu-nav-item" aria-current="page"><span class="mu-nav-icon">≡</span>All sessions<span class="mu-nav-count">11</span></button>
</nav>
<section style="flex: 0 0 var(--layout-queue); background: var(--surface-ground); border-right: var(--stroke-hairline) solid var(--line)">
<div class="mu-queue-head"><h1 class="mu-queue-title">All sessions</h1></div>
<div class="mu-tree">
<button class="mu-tree-row"><span class="mu-tree-fold">▾</span><span class="mu-swatch mu-p1"></span><span class="mu-tree-project mu-p1">muster</span></button>
<div class="mu-tree-children">
<button class="mu-tree-row"><span class="mu-tree-fold">▸</span><span class="mu-branch">⎇ main</span></button>
<button class="mu-tree-row"><span class="mu-tree-fold">▸</span><span class="mu-branch">⎇ feature/desktop-app</span></button>
</div>
</div>
</section>
<main class="mu-pane" style="flex: 1"></main>
</div>

<div class="mu-scrim" style="position: absolute; inset: 0; z-index: var(--z-scrim); display: flex; align-items: flex-start; justify-content: center; padding: 72px var(--space-24) var(--space-24)">
<div class="mu-dialog" role="dialog" aria-modal="true" aria-labelledby="ns-title" style="width: var(--size-dialog-wide); gap: var(--space-20)">
<h2 class="mu-dialog-title" id="ns-title">New session</h2>

<div class="mu-field">
<label class="mu-field-label" for="prompt">First prompt</label>
<textarea class="mu-field-input mu-field-input--area" id="prompt" style="border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent)">Add a Not seen filter to the desktop app's sidebar, counting sessions with news, the way the terminal UI's Needs you counts them.</textarea>
<span class="mu-field-hint">It names the chat at once; an agent names it better a few seconds later.</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-16)">
<div class="mu-field">
<span class="mu-field-label" id="proj-l">Project</span>
<button class="mu-select mu-select--lg" aria-labelledby="proj-l" aria-haspopup="listbox"><span class="mu-select-value"><span class="mu-swatch mu-p1"></span>muster</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<div class="mu-field">
<span class="mu-field-label" id="where-l">Where</span>
<div class="mu-seg" role="group" aria-labelledby="where-l" style="height: var(--size-control-lg); align-items: center"><button class="mu-seg-item" aria-pressed="true">A new worktree</button><button class="mu-seg-item" aria-pressed="false">Its checkout</button></div>
</div>
</div>

<div class="mu-field">
<label class="mu-field-label" for="branch">Branch <span class="mu-quiet" style="font-weight: 400">if you like</span></label>
<input class="mu-field-input" id="branch" placeholder="muster/ and six letters, if left empty" style="font-family: var(--font-mono); font-size: 12px">
</div>

<div class="mu-field">
<span class="mu-field-label" id="ag-l">Agent</span>
<div class="mu-choices" role="radiogroup" aria-labelledby="ag-l">
<button class="mu-choice" role="radio" aria-checked="true"><span class="mu-logo"><img src="/_blob/dfc7e764c4e2a273fc135902470acf23" alt=""></span>Claude Code<span class="mu-choice-note">last chosen</span></button>
<button class="mu-choice" role="radio" aria-checked="false"><span class="mu-logo"><img src="/_blob/a2ffa86bab0a20dd5c4ba0f2660c3fea" alt=""></span>Codex</button>
<button class="mu-choice" role="radio" aria-checked="false"><span class="mu-logo"><img src="/_blob/c161e767823acd431b9c967857542c89" alt=""></span>Gemini CLI</button>
<button class="mu-choice" role="radio" aria-checked="false"><span class="mu-logo"><img src="/_blob/9022fdb72074cc7ab16a193f7459f5df" alt=""></span>OpenCode</button>
<button class="mu-choice" role="radio" aria-checked="false"><span class="mu-logo mu-logo--mark">•</span>Goose</button>
<button class="mu-choice" role="radio" aria-checked="false"><span class="mu-logo mu-logo--mark mu-logo--shell">❯</span>A shell</button>
</div>
</div>

<div class="mu-dialog-actions" style="margin-top: 0">
<button class="mu-btn mu-btn--secondary mu-btn--lg" title="Cancel (⎋)">Cancel</button>
<button class="mu-btn mu-btn--primary mu-btn--lg" title="Start Claude Code (⌘⏎)">Start Claude Code</button>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
