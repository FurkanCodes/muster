<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muster Desktop, first run</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/muster/tokens.css">
<link rel="stylesheet" href="ds/muster/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="mu-root" data-theme="{{theme}}" style="height: 100vh; min-height: 600px; display: flex; flex-direction: column; overflow: hidden">

<header class="mu-titlebar" style="flex: none">
<div class="mu-traffic" aria-hidden="true"><span></span><span></span><span></span></div>
<span class="mu-kep mu-kep--asleep" title="Nothing works or waits yet">▼-ᴥ-▼ᶻ</span>
<span class="mu-spacer"></span>
<button class="mu-command"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span>Run a command</span><span class="mu-kbd">⌘K</span></button>
<span class="mu-spacer"></span>
<div class="mu-meter" role="img" aria-label="Memory 41 percent used"><span class="is-on"></span><span class="is-on"></span><span class="is-on"></span><span></span><span></span><span></span><span></span><span></span></div>
</header>

<div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap; overflow: auto">

<nav class="mu-nav" aria-label="Screens" style="flex: 1 0 var(--layout-sidebar); max-width: var(--layout-sidebar)">
<button class="mu-nav-item" aria-current="page"><span class="mu-nav-icon" style="font-size: 10px">▲</span>Needs you</button>
<button class="mu-nav-item"><span class="mu-nav-icon"><span class="mu-dot" style="background: var(--line-strong)"></span></span>Not seen</button>
<button class="mu-nav-item"><span class="mu-nav-icon">⠿</span>Working</button>
<button class="mu-nav-item"><span class="mu-nav-icon">≡</span>All sessions</button>
<div class="mu-nav-label">Projects</div>
<button class="mu-nav-item"><span class="mu-nav-icon"><svg width="14" height="14" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>Add a project</button>
<span style="flex: 1"></span>
<button class="mu-nav-item"><span class="mu-nav-icon">#</span>Tickets</button>
<button class="mu-nav-item"><span class="mu-nav-icon"><svg width="16" height="16" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"></path></svg></span>Settings</button>
</nav>

<main style="flex: 999 1 600px; min-width: 0; display: flex; background: var(--surface-ground)">
<div class="mu-empty">
<img class="mu-kep-portrait" src="/_blob/ccbf6d369010696adc210014fd667374" alt="Kep, Muster's sheepdog">
<div style="display: flex; flex-direction: column; gap: var(--space-8)">
<h1 class="mu-empty-title">Add a project to start</h1>
<p class="mu-empty-text">A project is a folder, usually a git repository. Muster gathers its agents, worktrees and tickets here, and keeps them running when this window closes.</p>
</div>
<div class="mu-empty-actions">
<button class="mu-btn mu-btn--primary mu-btn--lg" title="Add a project (a)">Add a project</button>
</div>
<span class="mu-meta">Or drop a folder on this window.</span>
</div>
</main>

</div>

<footer class="mu-statusbar" style="flex: none">
<span class="mu-hint"><span class="mu-kbd">a</span>add a project</span>
<span class="mu-spacer"></span>
<span class="mu-hint"><span class="mu-kbd">h</span>every key</span>
<span>Muster 0.4.1</span>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
