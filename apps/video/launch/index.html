<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Muster launch clip</title>
    <style>
      @font-face {
        font-family: "Instrument Sans";
        font-weight: 400;
        src: url("../node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Instrument Sans";
        font-weight: 600;
        src: url("../node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 400;
        src: url("../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        background: #171716;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(1100px 700px at 50% 55%, #1d1d1c, #171716 70%);
        font-family: "Instrument Sans", system-ui, sans-serif;
        color: #e8e6e1;
      }
      .hud,
      .world {
        position: absolute;
        inset: 0;
      }
      .world {
        transform-origin: 0 0;
        width: 1440px;
        height: 900px;
      }
      .hud {
        z-index: 2;
        pointer-events: none;
      }
      .window {
        position: absolute;
        left: 0;
        top: 0;
        width: 1440px;
        height: 900px;
        border-radius: 12px;
        overflow: hidden;
        background: #171716;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .shot {
        position: absolute;
        inset: 0;
        width: 1440px;
        height: 900px;
      }
      .lights {
        position: absolute;
        left: 14px;
        top: 15px;
        display: flex;
        gap: 8px;
        z-index: 5;
      }
      .lights i {
        width: 12px;
        height: 12px;
        border-radius: 6px;
      }
      .crop,
      .mask {
        background-repeat: no-repeat;
      }
      .over,
      .mask {
        position: absolute;
      }
      .act {
        position: absolute;
        inset: 0;
      }
      .line {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 0.26em;
        font-weight: 600;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .line1 {
        font-size: 120px;
        line-height: 1;
      }
      .line2 {
        font-size: 84px;
        line-height: 1;
        color: #e8e6e1;
      }
      .word {
        display: inline-block;
      }
      .card,
      .badge {
        position: absolute;
      }
      .card {
        padding: 10px;
        border-radius: 18px;
        background: #1d1d1c;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .card .crop {
        border-radius: 10px;
      }
      .badge .crop {
        border-radius: 10px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(239, 126, 107, 0.35);
      }
      .dot {
        position: absolute;
        left: 960px;
        top: 560px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #ef7e6b;
      }
      .question {
        position: absolute;
        left: 960px;
        top: 640px;
        font-size: 64px;
        font-weight: 600;
        color: #9b988f;
        white-space: nowrap;
      }
      .reveal,
      .outro {
        position: absolute;
        inset: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .reveal .logo,
      .outro .logo {
        width: 220px;
        height: 220px;
      }
      .reveal .name,
      .outro .name {
        font-size: 150px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.05;
        margin-top: 12px;
      }
      .tagline {
        font-size: 48px;
        color: #9b988f;
        margin-top: 10px;
      }
      .outro .logo {
        width: 170px;
        height: 170px;
      }
      .outro .name {
        font-size: 120px;
      }
      .install {
        margin-top: 46px;
        padding: 22px 34px;
        border-radius: 16px;
        background: #1d1d1c;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 27px;
        color: #e8e6e1;
        white-space: nowrap;
      }
      .install .prompt {
        color: #d97757;
      }
      .url {
        margin-top: 26px;
        font-size: 34px;
        color: #9b988f;
      }
      /* Each headline's side, and the band that keeps the window's edge clear of it. */
      .band {
        position: absolute;
      }
      .band-top {
        left: 0;
        right: 0;
        top: 0;
        height: 250px;
        background: linear-gradient(#171716 0, #171716f2 55%, #17171600 100%);
      }
      .band-bottom {
        left: 0;
        right: 0;
        bottom: 0;
        height: 280px;
        background: linear-gradient(to top, #171716 0, #171716f2 55%, #17171600 100%);
      }
      .band-left {
        left: 0;
        top: 0;
        bottom: 0;
        width: 740px;
        background: linear-gradient(to right, #171716 0, #171716 84%, #17171600 100%);
      }
      .band-right {
        right: 0;
        top: 0;
        bottom: 0;
        width: 740px;
        background: linear-gradient(to left, #171716 0, #171716 84%, #17171600 100%);
      }
      .headline {
        position: absolute;
      }
      .headline-top {
        left: 120px;
        top: 44px;
      }
      .headline-bottom {
        left: 120px;
        bottom: 56px;
      }
      .headline-left {
        left: 110px;
        top: 50%;
        width: 540px;
        transform: translateY(-50%);
      }
      .headline-right {
        left: 1290px;
        top: 50%;
        width: 540px;
        transform: translateY(-50%);
      }
      .headline .title {
        display: flex;
        flex-wrap: wrap;
        column-gap: 0.26em;
        font-size: 64px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.08;
      }
      .headline-left .title,
      .headline-right .title {
        font-size: 72px;
      }
      .headline .sub {
        margin-top: 12px;
        font-size: 30px;
        line-height: 1.3;
        color: #9b988f;
      }
      /* The keys pressed in a scene: a key cap, and what the terminal UI calls it. */
      .keys {
        position: relative;
        height: 72px;
        margin-top: 28px;
      }
      .key {
        position: absolute;
        left: 0;
        top: 0;
        align-items: center;
        gap: 12px;
        transform-origin: 0 50%;
      }
      .cap {
        min-width: 58px;
        height: 58px;
        padding: 0 16px;
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: #2b2b29;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 5px 0 #0c0c0b;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 30px;
        color: #e8e6e1;
      }
      .hint {
        margin-left: 8px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 28px;
        color: #9b988f;
      }
      .ring {
        position: absolute;
        box-sizing: border-box;
        border: 3px solid;
        border-radius: 12px;
      }
      .pointer,
      .ripple {
        position: absolute;
        transform-origin: 6px 4px;
      }
      .pointer svg {
        filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.55));
      }
      .ripple {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.9);
        box-sizing: border-box;
        transform-origin: 50% 50%;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      import { loadCut } from "./cut.js";
      import { build } from "./scenes.js";

      // `?cut=tui` plays the terminal UI's cut; the desktop app's is the default.
      const { cut, kit } = await loadCut(new URLSearchParams(location.search).get("cut") ?? "desktop");
      const seek = build(document.getElementById("stage"), cut, kit);
      window.seek = (t) => seek(t);
      // Ready once every face is loaded and every shot decoded.
      window.ready = Promise.all([
        document.fonts.load('600 64px "Instrument Sans"'),
        document.fonts.load('400 30px "Instrument Sans"'),
        document.fonts.load('400 27px "JetBrains Mono"'),
        ...[...document.images].map((image) => image.decode()),
        ...Object.values(kit.shots).map((shot) => {
          const image = new Image();
          image.src = `../${cut.KIT}/shots/${shot.file}`;
          return image.decode();
        }),
      ]).then(() => {
        seek(0);
        return true;
      });
    </script>
  </body>
</html>
