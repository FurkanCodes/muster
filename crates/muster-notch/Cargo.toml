[package]
name = "muster-notch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Muster's agents in the MacBook's notch while the person looks elsewhere"

[dependencies]
muster-core.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2.workspace = true
muster-client.workspace = true
tokio.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSAccessibility",
    "NSAccessibilityProtocols",
    "NSApplication",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSImage",
    "NSImageView",
    "NSPanel",
    "NSParagraphStyle",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes", "objc2"] }
objc2-core-graphics = { workspace = true, features = ["CGPath"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSData", "NSEnumerator", "NSGeometry", "NSString", "NSThread", "NSValue"] }
objc2-quartz-core = { workspace = true, features = [
    "CAAnimation",
    "CABase",
    "CALayer",
    "CAMediaTiming",
    "CAMediaTimingFunction",
    "CAShapeLayer",
    "CATransaction",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }

[lints]
workspace = true
