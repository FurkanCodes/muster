# Dependency checks run in CI: `cargo deny check`.

[graph]
all-features = false

[advisories]
# Known vulnerabilities and unmaintained crates fail the build.
yanked = "deny"

[licenses]
# The permissive licenses Muster's dependencies use today. Adding one is a
# deliberate decision, made here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Muster's own crates are not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
