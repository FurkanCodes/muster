[workspace]
members = ["cargo:."]

# Prebuilt binaries for each release, built by GitHub Actions when a
# version tag (v0.1.1, …) is pushed: a .tar.gz per platform with its
# SHA-256 checksum and a build attestation. install.sh fetches them.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = []
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
unix-archive = ".tar.gz"
github-attestations = true
pr-run-mode = "plan"
# Dependabot may move release.yml's actions/checkout on; dist accepts that
# rather than failing the release, and `dist generate` rewrites it anyway.
allow-dirty = ["ci"]
# Muster.app, built by .github/workflows/build-app.yml beside the binaries
# and published with them (PRODUCT.md §6a).
local-artifacts-jobs = ["./build-app"]
github-custom-job-permissions = { "build-app" = { attestations = "write", contents = "read", id-token = "write" } }
