# A panel: a session's live flow graph, drawn beside it by zoetrope's zoe.
# The plugin is only this manifest; zoe is zoetrope's, installed by you.
# docs/plugins.md says what every key means.
id = "session-graph"
name = "Session graph"
version = "0.1.0"
description = "A session's live flow graph beside it, drawn by zoetrope."
muster = "0.4.0"
requires = ["zoe"]
how_to_get = "brew install furkankly/tap/zoetrope, or see https://github.com/furkankly/zoetrope"

[[panels]]
id = "graph"
title = "graph"
on = "session"
# The session's own transcript, followed as the agent works.
command = ["zoe", "{transcript}", "--follow"]
key = "G"
